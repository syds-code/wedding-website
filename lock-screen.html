<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sydney &amp; Drew</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Sewell Wedding';
    src: url('/assets/SewellWedding-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --sand: #F5F2EA;
    --tulum: #AEA078;
    --cacao: #49391F;
    --caribbean: #6E92C4;
    --shoreline: #D0E2F4;
    --jungle: #848F5C;
    --agave: #C7D0A9;
  }

  * { box-sizing: border-box; }

  body {
    position: relative;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--shoreline);
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--cacao);
    padding: 24px;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url('/assets/backgrounds/blue-palms.png');
    background-repeat: repeat;
    background-size: 640px 640px;
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }

  .gate {
    position: relative;
    z-index: 1;
    max-width: 700px;
    width: 100%;
    text-align: center;
  }

  .kicker {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 20px;
    color: var(--cacao);
    margin: 0 0 6px;
  }

  .script-line {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    row-gap: 0.06em;
    column-gap: 0.3em;
    font-family: 'Sewell Wedding', cursive;
    font-weight: 400;
    color: var(--cacao);
    -webkit-text-stroke: 1.3px var(--cacao);
    text-stroke: 1.3px var(--cacao);
    font-size: clamp(64px, 13vw, 200px);
    line-height: 1;
    max-width: 94vw;
    margin: 16px auto;
  }

  .script-line span {
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    .script-line {
      flex-direction: column;
      align-items: center;
      row-gap: 0.02em;
      font-size: clamp(70px, 28vw, 170px);
    }

    /* "Sewell" alone carries a trailing swash that isn't counted in the
       font's own letter-spacing box, so centering by box width alone
       leaves it looking shifted right. This nudges it back by the
       measured overhang (~0.15em) so the ink itself sits centered. */
    .script-line span:first-child {
      transform: translateX(-0.15em);
    }

    .gate-bottom {
      margin-top: 40px;
    }
  }

  form,
  .blurb {
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  .sub {
    margin: -26px 0 24px;
  }

  .blurb {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.5;
    color: var(--cacao);
    margin-top: 0;
    margin-bottom: 32px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  input[type="password"] {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 20px;
    padding: 16px 18px;
    border: 1px solid var(--cacao);
    background: var(--sand);
    border-radius: 2px;
    color: var(--cacao);
    text-align: center;
  }

  input[type="password"]::placeholder {
    font-style: italic;
    color: var(--cacao);
    opacity: 0.6;
  }

  input[type="password"]:focus {
    outline: none;
    border-color: var(--caribbean);
  }

  button {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 19px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 16px 24px;
    background: var(--caribbean);
    color: var(--sand);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: var(--cacao);
  }

  .error {
    color: #a94442;
    font-size: 17px;
    margin: -8px 0 0;
    letter-spacing: 0.02em;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="gate">
    <div class="gate-top">
      <p class="kicker">Welcome to the</p>
      <p class="script-line"><span>Sewell</span><span>Wedding</span></p>
      <p class="kicker sub">Website</p>
    </div>
    <div class="gate-bottom">
      <p class="blurb">This site is still under construction. Check back soon or enter the password to peek early.</p>
      <form method="POST" action="/__gate">
        <input
          type="password"
          name="password"
          placeholder="Please enter password"
          autofocus
          required
        >
        {{ERROR}}
        <button type="submit">Enter</button>
      </form>
    </div>
  </div>
</body>
</html>
